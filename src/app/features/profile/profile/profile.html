<div class="profile">
  <h1>Profile</h1>
  @if (user(); as u) {
    <mat-card class="profile-card">
      <mat-card-header>
        <div mat-card-avatar class="profile-avatar">{{ u.name?.charAt(0)?.toUpperCase() ?? '?' }}</div>
        <mat-card-title>{{ u.name }}</mat-card-title>
        <mat-card-subtitle>{{ u.email }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <dl class="profile-details">
          <dt>Name</dt>
          <dd>{{ u.name }}</dd>
          <dt>Email</dt>
          <dd>{{ u.email }}</dd>
        </dl>
      </mat-card-content>
      <mat-card-actions>
        <a mat-button routerLink="/dashboard">Back to Dashboard</a>
      </mat-card-actions>
    </mat-card>
  } @else {
    <mat-card class="profile-card">
      <mat-card-content>
        <p>Not signed in.</p>
        <a mat-button routerLink="/login">Log in</a>
      </mat-card-content>
    </mat-card>
  }
</div>
