<div class="dashboard">
  <div class="dashboard-header">
    <h1>Projects</h1>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      New Project
    </button>
  </div>

  @if (loading()) {
    <mat-spinner diameter="40" class="spinner"></mat-spinner>
  } @else if (error()) {
    <mat-card class="error-card">
      <mat-card-content>
        <p>{{ error() }}</p>
        <button mat-button color="primary" (click)="loadProjects()">Retry</button>
      </mat-card-content>
    </mat-card>
  } @else if (projects().length === 0) {
    <mat-card class="empty-card">
      <mat-card-content>
        <p>No projects yet. Create your first project!</p>
        <button mat-raised-button color="primary" (click)="openCreateDialog()">Create Project</button>
      </mat-card-content>
    </mat-card>
  } @else {
    <div class="projects-grid">
      @for (project of projects(); track project.id) {
        <mat-card class="project-card">
          <mat-card-header>
            <mat-card-title>{{ project.name }}</mat-card-title>
          </mat-card-header>
          <mat-card-actions>
            <button mat-button color="primary" [routerLink]="['/project', project.id]">Open</button>
            <button mat-button color="warn" (click)="confirmDelete(project)">Delete</button>
          </mat-card-actions>
        </mat-card>
      }
    </div>
  }
</div>
