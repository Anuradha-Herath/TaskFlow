<h2 mat-dialog-title>Add Task</h2>
<mat-dialog-content class="dialog-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Title</mat-label>
    <input matInput [(ngModel)]="title" placeholder="Task title" />
    <mat-hint>Short, descriptive title</mat-hint>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput [(ngModel)]="description" placeholder="Optional description" rows="3"></textarea>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Priority</mat-label>
    <mat-select [(ngModel)]="priority">
      @for (p of priorities; track p.value) {
        <mat-option [value]="p.value">{{ p.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Due date</mat-label>
    <input matInput [matDatepicker]="duePicker" [(ngModel)]="dueDate" placeholder="Optional" />
    <mat-datepicker-toggle matIconSuffix [for]="duePicker"></mat-datepicker-toggle>
    <mat-datepicker #duePicker></mat-datepicker>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Assignee</mat-label>
    <mat-select [(ngModel)]="assigneeIdValue">
      <mat-option value="">Unassigned</mat-option>
      @for (u of users(); track u.id) {
        <mat-option [value]="u.id">{{ u.name }} ({{ u.email }})</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="getResult()" [disabled]="!title.trim()">
    Add
  </button>
</mat-dialog-actions>
