<h2 mat-dialog-title>Edit Task</h2>
<mat-dialog-content class="dialog-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Title</mat-label>
    <input matInput [(ngModel)]="task.title" placeholder="Task title" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput [(ngModel)]="task.description" placeholder="Optional description" rows="3"></textarea>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Status</mat-label>
    <mat-select [(ngModel)]="task.status">
      <mat-option value="todo">Todo</mat-option>
      <mat-option value="in_progress">In Progress</mat-option>
      <mat-option value="done">Done</mat-option>
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Priority</mat-label>
    <mat-select [(ngModel)]="task.priority">
      @for (p of priorities; track p.value) {
        <mat-option [value]="p.value">{{ p.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Due date</mat-label>
    <input matInput [matDatepicker]="duePicker" [(ngModel)]="taskDueDate" placeholder="Optional" />
    <mat-datepicker-toggle matIconSuffix [for]="duePicker"></mat-datepicker-toggle>
    <mat-datepicker #duePicker></mat-datepicker>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Assignee</mat-label>
    <mat-select [(ngModel)]="taskAssigneeIdValue">
      <mat-option value="">Unassigned</mat-option>
      @for (u of users(); track u.id) {
        <mat-option [value]="u.id">{{ u.name }} ({{ u.email }})</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="getTask()" [disabled]="!task.title.trim()">
    Save
  </button>
</mat-dialog-actions>
